name: Build Mind-Forge Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # No version pinned on purpose: llama_cpp_dart needs a Dart SDK
          # >=3.7.0 (via its ffi dependency). Pinning an old Flutter version
          # here is what broke the previous run — latest stable always
          # bundles a current-enough Dart.
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (required for llama.cpp native compilation)
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # No production keystore/secrets needed. We persist the standard
      # Android debug keystore across workflow runs so every build is
      # signed with the SAME key — otherwise each fresh runner would
      # generate a brand-new debug key and every release would look like
      # a different app to Android, blocking in-place updates.
      - name: Restore/seed debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mind-forge-pro-debug-keystore-v1

      - name: Generate debug keystore if not cached
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mind-Forge Pro Debug,O=dev-boffin-io,C=BD"
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      # llama_cpp_dart (0.2.x line) is a pure FFI binding — it does NOT ship
      # a compiled llama.cpp binary. We build libllama.so (and the libggml*.so
      # it depends on) ourselves and place them where the Android Gradle
      # plugin picks up native libs automatically: jniLibs/<abi>/.
      - name: Build llama.cpp shared libraries for arm64-v8a
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_C_FLAGS="-march=armv8-a" \
            -DCMAKE_CXX_FLAGS="-march=armv8-a" \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF

          cmake --build /tmp/llama.cpp/build-android --config Release -j"$(nproc)"

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          find /tmp/llama.cpp/build-android -name "*.so" -exec cp -v {} android/app/src/main/jniLibs/arm64-v8a/ \;
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Build release APK (arm64 only, minified + signed)
        run: flutter build apk --release --target-platform android-arm64

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-pro-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

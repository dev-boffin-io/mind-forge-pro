name: Build Mind-Forge Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # No version pinned on purpose: llama_cpp_dart needs a Dart SDK
          # >=3.7.0 (via its ffi dependency). Pinning an old Flutter version
          # here is what broke the previous run — latest stable always
          # bundles a current-enough Dart.
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # No production keystore/secrets needed. We persist the standard
      # Android debug keystore across workflow runs so every build is
      # signed with the SAME key — otherwise each fresh runner would
      # generate a brand-new debug key and every release would look like
      # a different app to Android, blocking in-place updates.
      - name: Restore/seed debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mind-forge-pro-debug-keystore-v1

      - name: Generate debug keystore if not cached
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mind-Forge Pro Debug,O=dev-boffin-io,C=BD"
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      # llama_cpp_dart 0.9.x ships no source to compile — it publishes a
      # prebuilt Android AAR (CPU + mtmd, arm64-v8a) from its own CI, built
      # against whatever llama.cpp commit that package version is pinned
      # to. We just fetch the release asset matching our pinned pubspec
      # version and drop it where Gradle expects a local .aar dependency.
      - name: Download llama_cpp_dart prebuilt Android AAR
        run: |
          mkdir -p android/app/libs
          curl -fL \
            "https://github.com/netdur/llama_cpp_dart/releases/download/v0.9.0-dev.12/llama-cpp-dart.aar" \
            -o android/app/libs/llama-cpp-dart.aar
          ls -la android/app/libs/

      - name: Build release APK (arm64 only, minified + signed)
        run: flutter build apk --release --target-platform android-arm64

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-pro-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

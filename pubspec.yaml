name: mind_forge_pro
description: >
  Offline, on-device "second brain" AI agent for Android — natively embedded
  llama.cpp inference, local RAG memory, and a built-in local API server.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Native llama.cpp inference via Dart FFI — LlamaEngine API (0.9.x line).
  # The 0.2.x line used earlier is retired by the maintainer; its FFI
  # bindings are pinned to a specific llama.cpp submodule commit, which our
  # from-source NDK build (cloning llama.cpp's unpinned master branch) could
  # never reliably match — the likely cause of the native crashes we hit.
  # 0.9.x ships a prebuilt Android AAR from the package's own CI instead, so
  # the CI workflow downloads llama-cpp-dart.aar into android/app/libs/
  # rather than compiling anything itself. Pinned to an exact prerelease
  # (not ^) since pub's caret ranges don't span prereleases, and the API
  # itself still has occasional breaking changes pre-1.0.
  llama_cpp_dart: 0.9.0-dev.12

  # Local persistent storage (chat history + RAG memory)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Built-in local HTTP API server ("Server Manager")
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # File picking for selecting .gguf models from device storage
  file_picker: ^8.0.0+1

  # No runtime permissions are requested anywhere in the app: the model
  # picker uses Android's Storage Access Framework (needs none), and the
  # MethodChannel-triggered native actions (e.g. flashlight) will need
  # their own permission handling on the Kotlin side once implemented.

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

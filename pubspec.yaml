name: mind_forge_pro
description: >
  Offline, on-device "second brain" AI agent for Android — natively embedded
  llama.cpp inference, local RAG memory, and a built-in local API server.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Native llama.cpp inference via Dart FFI
  llama_cpp_dart: ^0.0.13

  # Local persistent storage (chat history + RAG memory)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Built-in local HTTP API server ("Server Manager")
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # File picking for selecting .gguf models from device storage
  file_picker: ^8.0.0+1

  # Permission handling (storage access on Android 11+)
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

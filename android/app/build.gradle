plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace 'io.devboffin.mindforgepro'
    compileSdk 34
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "io.devboffin.mindforgepro"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode flutter.versionCode
        versionName flutter.versionName

        // Native inference is arm64-only for this build; extend if needed.
        // The llama.cpp C++ engine itself is compiled by the llama_cpp_dart
        // plugin's own Gradle/CMake module — nothing extra to wire up here.
        ndk {
            abiFilters "arm64-v8a"
            // Strip native debug symbols from the release .so files instead
            // of shipping the full unstripped llama.cpp binary.
            debugSymbolLevel = 'NONE'
        }
    }

    signingConfigs {
        // No production keystore required. This explicitly points at the
        // standard Android debug keystore (auto-generated by the SDK at
        // ~/.android/debug.keystore with the well-known alias
        // "androiddebugkey" / password "android"). A debug-signed APK
        // installs and runs on any device exactly like a normally-signed
        // one — Android only refuses installs when a signature *mismatches*
        // an already-installed app with the same applicationId, not because
        // the key is "debug". The CI workflow caches this keystore so every
        // build reuses the same key, letting you install updates in place
        // instead of having to uninstall the previous APK each time.
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8 shrinking + resource shrinking + Flutter's own tree-shaking
            // (icons, unused Dart code) all apply here.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

flutter {
    source '../..'
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace 'io.devboffin.mindforgepro'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "io.devboffin.mindforgepro"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode flutter.versionCode
        versionName flutter.versionName

        // llama_cpp_dart's prebuilt AAR only ships an arm64-v8a build.
        ndk {
            abiFilters "arm64-v8a"
            // Strip native debug symbols from the release .so files instead
            // of shipping the full unstripped llama.cpp binary.
            debugSymbolLevel = 'SYMBOL_TABLE'
        }
    }

    signingConfigs {
        // No production keystore required. This explicitly points at the
        // standard Android debug keystore (auto-generated by the SDK at
        // ~/.android/debug.keystore with the well-known alias
        // "androiddebugkey" / password "android"). A debug-signed APK
        // installs and runs on any device exactly like a normally-signed
        // one — Android only refuses installs when a signature *mismatches*
        // an already-installed app with the same applicationId, not because
        // the key is "debug". The CI workflow caches this keystore so every
        // build reuses the same key, letting you install updates in place
        // instead of having to uninstall the previous APK each time.
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8 shrinking + resource shrinking + Flutter's own tree-shaking
            // (icons, unused Dart code) all apply here.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // Dart FFI's dlopen() needs libllama.so to actually exist as a
            // file at applicationInfo.nativeLibraryDir. AGP's modern
            // default (useLegacyPackaging = false) keeps native libraries
            // compressed inside the APK and never extracts them to disk —
            // fine for libraries loaded via System.loadLibrary(), but it
            // silently breaks dlopen()-by-absolute-path. Force legacy
            // packaging so the libraries are actually extracted.
            useLegacyPackaging = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Prebuilt native binary for llama_cpp_dart 0.9.x, downloaded by the
    // CI workflow (or place it here yourself for local builds) — see
    // https://github.com/netdur/llama_cpp_dart#install
    implementation files('libs/llama-cpp-dart.aar')
}
